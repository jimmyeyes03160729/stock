name: 自動更新台股市場真實數據

on:
  schedule:
    # 台灣時間週一至週五 14:00 自動執行 (對應 UTC 06:00)
    - cron: '0 6 * * 1-5'
  workflow_dispatch: # 支援在 GitHub 網頁上手動按「Run workflow」隨時執行測試

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 允許 Actions 把更新後的 market_data.json 存回倉庫

    steps:
      - name: 檢出倉庫代碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安裝相依套件
        run: |
          pip install finlab pandas numpy

      - name: 執行資料同步
        env:
          FINLAB_API_TOKEN: ${{ secrets.FINLAB_API_TOKEN }}
        run: |
          python update_market.py

      - name: 自動提交並推送到 GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add market_data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "自動更新：全市場行情與 AI 因子 [skip ci]" && git push)
