name: 自動更新台股市場真實數據

on:
  schedule:
    # 台灣時間 (UTC+8) 週一至週五 14:00 換算為 UTC 06:00
    - cron: '0 6 * * 1-5'
  workflow_dispatch: # 支援手動觸發測試

permissions:
  contents: write

jobs:
  sync_market_data:
    runs-on: ubuntu-latest

    steps:
      - name: 簽出最新代碼
        uses: actions/checkout@v5

      - name: 設定 Python 環境
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 安裝 FinLab 及量化相依套件
        run: |
          python -m pip install --upgrade pip
          pip install finlab pandas numpy

      - name: 執行資料同步更新
        env:
          FINLAB_API_TOKEN: ${{ secrets.FINLAB_API_TOKEN }}
        run: |
          python update_market.py

      - name: 提交並推送最新 market_data.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add market_data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto sync: 更新最新台股盤後與多因子數據 [skip ci]" && git push)
