<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>台股智慧戰情與推薦系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .flash-up { animation: flashUp 0.8s; }
        .flash-down { animation: flashDown 0.8s; }
        @keyframes flashUp { 0% { background-color: rgba(239, 68, 68, 0.4); } 100% { background-color: transparent; } }
        @keyframes flashDown { 0% { background-color: rgba(34, 197, 94, 0.4); } 100% { background-color: transparent; } }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-5">
    <div class="max-w-7xl mx-auto space-y-5">
        
        <header class="flex flex-wrap justify-between items-center bg-slate-900 p-4 rounded-xl border border-slate-800 gap-4">
            <div>
                <h1 class="text-xl font-black tracking-wide text-white">台股智慧戰情與選股系統</h1>
                <p class="text-xs text-slate-400 mt-0.5">全面中文化 | 支援代號與名稱雙向搜尋（例如輸入：00878 或 三集瑞）</p>
            </div>
            
            <div class="relative w-72">
                <input id="searchInput" type="text" oninput="handleSearch(this.value)" placeholder="搜尋股名或代號 (如：三集瑞、00878)" 
                       class="w-full bg-slate-950 border border-slate-700 text-xs px-3 py-2 rounded-lg text-white focus:outline-none focus:border-indigo-500">
                <div id="searchDropdown" class="absolute left-0 right-0 top-10 bg-slate-900 border border-slate-700 rounded-lg shadow-xl z-50 hidden divide-y divide-slate-800"></div>
            </div>
        </header>

        <section class="bg-slate-900 rounded-xl p-5 border-2 border-red-500/30 shadow-lg relative">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <div class="flex items-center gap-2">
                    <span class="w-2.5 h-2.5 rounded-full bg-red-500 animate-pulse"></span>
                    <h2 class="text-base font-bold text-white">台灣加權指數 (TAIEX) 即時大盤</h2>
                    <span class="text-[11px] bg-red-950/80 text-red-300 border border-red-800/50 px-2 py-0.5 rounded font-medium">鎖定儀表板 (無法刪除)</span>
                </div>
                <div class="text-xs text-slate-400">成交預估: <span id="marketVolume" class="text-slate-200 font-medium">3,450 億</span></div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mt-3" id="marketBox">
                <div class="bg-slate-950 p-4 rounded-lg border border-slate-800">
                    <div class="text-xs text-slate-400">目前指數</div>
                    <div class="text-3xl font-black mt-1" id="marketPrice">--</div>
                </div>
                <div class="bg-slate-950 p-4 rounded-lg border border-slate-800">
                    <div class="text-xs text-slate-400">漲跌點數</div>
                    <div class="text-2xl font-bold mt-1" id="marketChange">--</div>
                </div>
                <div class="bg-slate-950 p-4 rounded-lg border border-slate-800">
                    <div class="text-xs text-slate-400">漲跌幅度</div>
                    <div class="text-2xl font-bold mt-1" id="marketPct">--</div>
                </div>
            </div>
        </section>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-5">
            
            <div class="bg-slate-900 rounded-xl p-4 border border-slate-800 space-y-4">
                <div class="flex justify-between items-center">
                    <h2 class="font-bold text-sm text-slate-200">自選個股群組</h2>
                    <button onclick="createGroup()" class="text-xs bg-indigo-600 hover:bg-indigo-500 px-2.5 py-1 rounded text-white font-medium">+ 新群組</button>
                </div>

                <div id="groupContainer" class="space-y-3">
                    </div>
            </div>

            <div class="lg:col-span-2 bg-slate-900 rounded-xl p-4 border border-slate-800 space-y-4">
                <div class="flex flex-wrap justify-between items-center gap-2">
                    <div>
                        <h2 class="font-bold text-sm text-white">價位區間看漲推薦系統</h2>
                        <p class="text-[11px] text-slate-400">輸入目標股價區間，自動計算日/月/季線共振，挑選具看漲潛力標的</p>
                    </div>
                    <div class="flex items-center gap-2">
                        <input id="minPrice" type="number" placeholder="最低價" class="bg-slate-950 border border-slate-700 text-xs px-2.5 py-1.5 rounded w-20 text-white">
                        <span class="text-slate-500 text-xs">~</span>
                        <input id="maxPrice" type="number" placeholder="最高價" class="bg-slate-950 border border-slate-700 text-xs px-2.5 py-1.5 rounded w-20 text-white">
                        <button onclick="fetchBullishRecommendations()" class="text-xs bg-red-600 hover:bg-red-500 px-3 py-1.5 rounded text-white font-bold">開始推薦篩選</button>
                    </div>
                </div>

                <div class="overflow-x-auto">
                    <table class="w-full text-left text-xs">
                        <thead class="bg-slate-950 text-slate-400">
                            <tr>
                                <th class="p-2.5">股票標的 (全名)</th>
                                <th class="p-2.5">現價</th>
                                <th class="p-2.5">綜合評價</th>
                                <th class="p-2.5">看漲評分</th>
                                <th class="p-2.5">日線</th>
                                <th class="p-2.5">月線</th>
                                <th class="p-2.5">季線</th>
                                <th class="p-2.5">操作</th>
                            </tr>
                        </thead>
                        <tbody id="recommendTable" class="divide-y divide-slate-800">
                            </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div id="detailSection" class="bg-slate-900 rounded-xl p-5 border border-slate-800 hidden space-y-4">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <h3 class="font-bold text-base text-white" id="detailTitle">個股詳情</h3>
                <button onclick="document.getElementById('detailSection').classList.add('hidden')" class="text-slate-400 hover:text-white">&times; 關閉</button>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs">
                <div>
                    <h4 class="font-bold text-sky-400 mb-2">歷年發放股利</h4>
                    <table class="w-full bg-slate-950 rounded-lg overflow-hidden">
                        <thead class="bg-slate-900 text-slate-400">
                            <tr>
                                <th class="p-2">年度</th>
                                <th class="p-2">現金股利</th>
                                <th class="p-2">股票股利</th>
                                <th class="p-2">殖利率</th>
                            </tr>
                        </thead>
                        <tbody id="dividendTable" class="divide-y divide-slate-900"></tbody>
                    </table>
                </div>
                <div>
                    <h4 class="font-bold text-sky-400 mb-2">日 / 月 / 季 均線分析判定</h4>
                    <div id="cycleDiagnosis" class="space-y-2"></div>
                </div>
            </div>
        </div>

    </div>

    <script>
        // 1. WebSocket 大盤即時更新
        const socket = new WebSocket(`ws://${window.location.host}/ws/market`);
        socket.onmessage = (event) => {
            const data = JSON.parse(event.data);
            if (data.type === "MARKET_TICK") {
                const m = data.market_data;
                const pElem = document.getElementById("marketPrice");
                const cElem = document.getElementById("marketChange");
                const pctElem = document.getElementById("marketPct");

                pElem.textContent = m.price.toFixed(2);
                cElem.textContent = (m.change >= 0 ? "+" : "") + m.change.toFixed(2);
                pctElem.textContent = (m.pct_change >= 0 ? "+" : "") + m.pct_change.toFixed(2) + "%";

                // 台股紅漲綠跌
                const color = m.change >= 0 ? "text-red-500" : "text-emerald-400";
                const flash = m.change >= 0 ? "flash-up" : "flash-down";

                pElem.className = `text-3xl font-black mt-1 ${color} ${flash}`;
                cElem.className = `text-2xl font-bold mt-1 ${color}`;
                pctElem.className = `text-2xl font-bold mt-1 ${color}`;
                setTimeout(() => pElem.classList.remove(flash), 800);
            }
        };

        // 2. 智慧搜尋：輸入「三集瑞」或「00878」
        async function handleSearch(val) {
            const dropdown = document.getElementById("searchDropdown");
            if (!val.trim()) {
                dropdown.classList.add("hidden");
                return;
            }
            const res = await fetch(`/api/v2/stocks/search?q=${encodeURIComponent(val)}`);
            const data = await res.json();
            if (data.length === 0) {
                dropdown.classList.add("hidden");
                return;
            }
            dropdown.innerHTML = data.map(item => `
                <div onclick="addStockFromSearch('${item.symbol}')" class="p-2.5 hover:bg-slate-800 cursor-pointer flex justify-between items-center">
                    <span class="font-bold text-white">${item.display}</span>
                    <span class="text-[11px] text-indigo-400">+ 加入自選</span>
                </div>
            `).join('');
            dropdown.classList.remove("hidden");
        }

        // 3. 載入自選群組 (確保顯示格式為：名稱 (代號))
        async function loadWatchlists() {
            const res = await fetch('/api/v2/watchlists');
            const data = await res.json();
            const container = document.getElementById("groupContainer");
            container.innerHTML = "";

            data.forEach(grp => {
                const div = document.createElement("div");
                div.className = "p-3 bg-slate-950 rounded-lg border border-slate-800";
                div.innerHTML = `
                    <div class="flex justify-between items-center mb-2">
                        <span class="font-bold text-xs text-indigo-400">${grp.name}</span>
                        <button onclick="promptAddStock(${grp.id})" class="text-[11px] text-slate-400 hover:text-white">+ 加股</button>
                    </div>
                    <div class="flex flex-wrap gap-1.5">
                        ${grp.items.map(it => `
                            <span onclick="showDetail('${it.symbol}', '${it.display_name}')" 
                                  class="cursor-pointer bg-slate-900 hover:bg-slate-800 px-2 py-1 rounded text-xs text-slate-200 border border-slate-700">
                                ${it.display_name}
                            </span>
                        `).join('')}
                    </div>
                `;
                container.appendChild(div);
            });
        }

        async function promptAddStock(groupId) {
            const input = prompt("請輸入台股代號或名稱 (例如輸入: 00878 或 三集瑞):");
            if (!input) return;
            await fetch(`/api/v2/watchlists/${groupId}/items`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ query: input })
            });
            loadWatchlists();
        }

        async function addStockFromSearch(symbol) {
            document.getElementById("searchDropdown").classList.add("hidden");
            document.getElementById("searchInput").value = "";
            // 加入到第一個群組
            await fetch(`/api/v2/watchlists/1/items`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ query: symbol })
            });
            loadWatchlists();
        }

        async function createGroup() {
            const name = prompt("請輸入群組名稱 (例如：ETF高股息、被動元件族群):");
            if (!name) return;
            await fetch('/api/v2/watchlists', {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ name })
            });
            loadWatchlists();
        }

        // 4. 價格區間推薦篩選
        async function fetchBullishRecommendations() {
            const min = document.getElementById("minPrice").value || 0;
            const max = document.getElementById("maxPrice").value || 99999;
            const res = await fetch(`/api/v2/screener/bullish?min_price=${min}&max_price=${max}`);
            const data = await res.json();
            const tbody = document.getElementById("recommendTable");
            tbody.innerHTML = "";

            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" class="p-3 text-center text-slate-500">該價位區間暫無看漲推薦標的</td></tr>`;
                return;
            }

            data.forEach(s => {
                const tr = document.createElement("tr");
                tr.className = "hover:bg-slate-800/50";
                tr.innerHTML = `
                    <td class="p-2.5 font-bold text-white">${s.display_name}</td>
                    <td class="p-2.5 text-slate-200">$${s.price}</td>
                    <td class="p-2.5"><span class="bg-red-950 text-red-400 border border-red-800 px-1.5 py-0.5 rounded font-semibold">${s.overall_signal_zh}</span></td>
                    <td class="p-2.5 font-bold text-amber-400">${s.score} 分</td>
                    <td class="p-2.5 text-slate-300">${s.daily_signal}</td>
                    <td class="p-2.5 text-slate-300">${s.monthly_signal}</td>
                    <td class="p-2.5 text-slate-300">${s.quarterly_signal}</td>
                    <td class="p-2.5"><button onclick="showDetail('${s.symbol}', '${s.display_name}')" class="bg-indigo-600 hover:bg-indigo-500 px-2 py-1 rounded text-white text-[11px]">詳情</button></td>
                `;
                tbody.appendChild(tr);
            });
        }

        // 顯示股利與多週期判定
        async function showDetail(symbol, displayName) {
            const sec = document.getElementById("detailSection");
            document.getElementById("detailTitle").textContent = `${displayName} 完整分析報告`;
            sec.classList.remove("hidden");

            // 股利
            const dRes = await fetch(`/api/v2/stocks/${symbol}/dividends`);
            const dData = await dRes.json();
            const dt = document.getElementById("dividendTable");
            dt.innerHTML = dData.length ? dData.map(d => `
                <tr>
                    <td class="p-2">${d.year}</td>
                    <td class="p-2 text-red-400">$${d.cash_dividend} 元</td>
                    <td class="p-2">$${d.stock_dividend} 股</td>
                    <td class="p-2 text-amber-400 font-semibold">${d.yield_rate}%</td>
                </tr>
            `).join('') : `<tr><td colspan="4" class="p-2 text-center text-slate-500">暫無股利紀錄</td></tr>`;

            // 多週期
            const diag = document.getElementById("cycleDiagnosis");
            diag.innerHTML = `
                <div class="p-2 bg-slate-950 rounded border border-slate-800 flex justify-between">
                    <span>日線判定 (短線走勢)</span><span class="text-red-400 font-bold">看漲 (突破短期均線)</span>
                </div>
                <div class="p-2 bg-slate-950 rounded border border-slate-800 flex justify-between">
                    <span>月線判定 (波段位階)</span><span class="text-red-400 font-bold">看漲 (中多格局)</span>
                </div>
                <div class="p-2 bg-slate-950 rounded border border-slate-800 flex justify-between">
                    <span>季線判定 (長期循環)</span><span class="text-red-400 font-bold">強烈看多 (季線生命線上揚)</span>
                </div>
            `;
        }

        // 初始化
        loadWatchlists();
        fetchBullishRecommendations();
    </script>
</body>
</html>
