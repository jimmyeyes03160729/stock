<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>台股量化預判與自選系統 By JimmyWei</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { getDatabase, ref, set, get, onValue } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-database.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCAl-PY9lk41YGbq4HJIVElYJqiNdpPr2g",
      authDomain: "money-7c81c.firebaseapp.com",
      databaseURL: "https://money-7c81c-default-rtdb.firebaseio.com",
      projectId: "money-7c81c",
      storageBucket: "money-7c81c.firebasestorage.app",
      messagingSenderId: "250032270278",
      appId: "1:250032270278:web:3275df2ed0a8e8a022a0c7",
      measurementId: "G-WKJ00E5ZF4"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);
    const googleProvider = new GoogleAuthProvider();

    let unsubscribeFavorites = null;

    window.cloudDB = {
      // 驗證自訂帳號密碼 (與欠款系統相同)
      verifyCustomUser: async (customUser, pass) => {
        const userRef = ref(db, `user_credentials/${customUser}`);
        const snap = await get(userRef);
        const data = snap.val();
        if (data) return data.password === pass;
        if (customUser === 'jimmyeyes' && pass === '22301989') return true;
        return false;
      },

      // Google 綁定驗證
      getGoogleBinding: async (uid) => {
        const bindingRef = ref(db, `bindings/${uid}`);
        const snap = await get(bindingRef);
        return snap.val();
      },

      // 監聽並同步自選股
      listenFavorites: (username, callback) => {
        if (unsubscribeFavorites) unsubscribeFavorites();
        const favRef = ref(db, `users/${username}/stock_favorites`);
        unsubscribeFavorites = onValue(favRef, (snapshot) => {
          callback(snapshot.val());
        });
      },

      // 儲存自選股
      saveFavorites: (username, favoritesList) => {
        const favRef = ref(db, `users/${username}/stock_favorites`);
        return set(favRef, favoritesList);
      }
    };

    window.cloudAuth = {
      loginWithGoogle: () => signInWithPopup(auth, googleProvider),
      logout: () => signOut(auth),
      onAuthChange: (cb) => onAuthStateChanged(auth, cb)
    };

    window.dispatchEvent(new Event('firebase-ready'));
  </script>

  <style>
    body {
      -webkit-tap-highlight-color: transparent;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col justify-between">

  <div id="loginView" class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-slate-900 p-6 rounded-2xl shadow-xl w-full max-w-sm border border-slate-800 space-y-4">
      <div class="text-center">
        <h1 class="text-xl font-bold text-white flex items-center justify-center gap-2">
          <span>📈</span> 台股量化預判看板
        </h1>
        <p class="text-xs text-slate-400 mt-1">請使用欠款記帳同組帳號登入</p>
      </div>

      <button onclick="handleGoogleSignIn()" class="w-full flex items-center justify-center gap-2 bg-white border border-slate-300 py-2.5 rounded-xl font-semibold text-sm text-slate-800 shadow-sm active:bg-slate-100 transition">
        <svg class="w-4 h-4" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        使用 Google 帳號一鍵登入
      </button>

      <div class="flex items-center my-3">
        <div class="flex-1 border-t border-slate-800"></div>
        <span class="px-2 text-[11px] text-slate-500">或使用自訂帳密</span>
        <div class="flex-1 border-t border-slate-800"></div>
      </div>

      <div>
        <label class="block text-xs font-medium text-slate-400 mb-1">自訂帳號</label>
        <input id="loginUser" type="text" placeholder="請輸入帳號"
               autocapitalize="none" autocorrect="off" spellcheck="false"
               class="w-full px-3 py-2 border border-slate-700 rounded-xl text-sm bg-slate-800 focus:outline-none focus:ring-2 focus:ring-sky-500 text-white font-medium">
      </div>
      <div>
        <label class="block text-xs font-medium text-slate-400 mb-1">密碼</label>
        <input id="loginPass" type="password" placeholder="請輸入密碼"
               autocapitalize="none" autocorrect="off"
               class="w-full px-3 py-2 border border-slate-700 rounded-xl text-sm bg-slate-800 focus:outline-none focus:ring-2 focus:ring-sky-500 text-white">
      </div>
      <p id="loginError" class="text-xs text-rose-400 hidden text-center">帳號或密碼錯誤！請重新輸入。</p>
      <button onclick="handleCustomLogin()" class="w-full bg-sky-600 text-white py-2.5 rounded-xl font-semibold text-sm active:bg-sky-700 shadow-md">帳密登入</button>
    </div>
  </div>

  <div id="mainApp" class="hidden max-w-4xl mx-auto px-4 py-4 space-y-4 flex-1 w-full pb-10">
    <header class="bg-slate-900 px-4 py-3 rounded-2xl shadow-sm border border-slate-800 flex justify-between items-center">
      <div class="flex items-center gap-2">
        <span class="text-xl">📈</span>
        <div>
          <h1 class="text-sm font-bold text-white tracking-tight">台股量化預判看板</h1>
          <p class="text-[10px] text-slate-400">用戶：<span id="currentAccountBadge" class="font-bold text-sky-400 font-mono">--</span></p>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span id="syncStatus" class="inline-flex items-center gap-1 text-[10px] bg-emerald-950 text-emerald-300 border border-emerald-800 px-2 py-0.5 rounded-full font-medium">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
          已同步
        </span>
        <button onclick="handleGlobalLogout()" class="text-xs text-slate-400 hover:text-rose-400 px-1">登出</button>
      </div>
    </header>

    <section class="bg-slate-900 p-4 rounded-2xl border border-slate-800 space-y-3">
      <div class="flex flex-wrap items-center justify-between gap-2">
        <div class="flex items-center gap-2">
          <h2 class="text-xs font-bold text-sky-400 tracking-wider">⭐ 我的自選股清單</h2>
          <span class="text-[10px] text-slate-500">(可點擊切換查看)</span>
        </div>
        
        <div class="flex items-center gap-1.5 w-full sm:w-auto">
          <input id="newStockInput" type="text" placeholder="代號 (如: 2603)" 
                 class="px-3 py-1.5 text-xs bg-slate-800 border border-slate-700 rounded-lg text-white focus:outline-none focus:ring-1 focus:ring-sky-500 w-28 uppercase">
          <button onclick="addNewStock()" class="bg-sky-600 hover:bg-sky-500 text-white text-xs px-3 py-1.5 rounded-lg font-bold shadow active:scale-95 transition">
            ＋ 加入自選
          </button>
        </div>
      </div>

      <div id="favoritesContainer" class="flex flex-wrap gap-2 pt-1">
        </div>
    </section>

    <section class="grid grid-cols-2 sm:grid-cols-4 gap-3">
      <div class="bg-slate-900 p-3 rounded-xl border border-slate-800">
        <div class="text-[11px] text-slate-400">目前標的 / 現價</div>
        <div class="text-xl font-bold text-white mt-0.5" id="cardPrice">--</div>
      </div>
      <div class="bg-slate-900 p-3 rounded-xl border border-slate-800">
        <div class="text-[11px] text-slate-400">10日突破機率 / 評級</div>
        <div class="text-base font-bold text-sky-400 mt-1" id="cardProb">--</div>
      </div>
      <div class="bg-slate-900 p-3 rounded-xl border border-slate-800">
        <div class="text-[11px] text-slate-400">三大法人當日買賣超</div>
        <div class="text-base font-bold mt-1" id="cardInst">--</div>
      </div>
      <div class="bg-slate-900 p-3 rounded-xl border border-slate-800 flex items-center justify-between">
        <div>
          <div class="text-[11px] text-slate-400">最愛狀態</div>
          <div class="text-xs font-bold text-slate-200 mt-1" id="favStatusText">已在最愛</div>
        </div>
        <button id="toggleFavBtn" onclick="toggleCurrentFavorite()" class="p-2 rounded-lg border border-slate-700 text-lg hover:bg-slate-800 transition">
          ⭐
        </button>
      </div>
    </section>

    <section class="bg-slate-900 p-4 rounded-2xl border border-slate-800 space-y-3">
      <div class="flex flex-wrap justify-between items-center gap-2">
        <div>
          <h3 class="text-sm font-bold text-white flex items-center gap-2">
            <span id="chartTitle">2330 走勢與未來 20 日蒙地卡羅情境預測</span>
          </h3>
          <p class="text-[10px] text-slate-400 mt-0.5">
            日 K（紅漲綠跌）• 虛線為 P50 中位基準 • 上下邊界為 P90 樂觀/P10 悲觀信賴帶
          </p>
        </div>
        <div class="flex items-center gap-3 text-xs font-mono">
          <span class="text-emerald-400" id="badgeP90">● P90: --</span>
          <span class="text-sky-400" id="badgeP50">-- P50: --</span>
          <span class="text-rose-400" id="badgeP10">● P10: --</span>
        </div>
      </div>

      <div id="tvChartContainer" class="w-full rounded-lg overflow-hidden" style="height: 460px;"></div>
    </section>
  </div>

  <footer class="py-3 text-center text-[11px] text-slate-500">
    台股量化預判與自選系統 By JimmyWei • 數據僅供開源量化研究用途
  </footer>

  <script>
    // 預設股票字典與初始自選股
    const STOCK_NAME_MAP = {
      "2330": "台積電",
      "2454": "聯發科",
      "2317": "鴻海",
      "2603": "長榮",
      "2382": "廣達",
      "3231": "緯創"
    };
    const DEFAULT_FAVORITES = ["2330", "2454", "2317"];

    let state = {
      isLoggedIn: localStorage.getItem('stock_auth') === 'true',
      currentUser: localStorage.getItem('stock_current_user') || '',
      favorites: JSON.parse(localStorage.getItem('stock_favorites')) || DEFAULT_FAVORITES,
      selectedStock: "2330",
      currentStockData: null
    };

    let chartInstance = null;
    let candleSeries = null;
    let p90Series = null;
    let p50Series = null;
    let p10Series = null;

    // ========== 登入邏輯 (共用欠款帳號密碼) ==========
    async function handleCustomLogin() {
      const user = document.getElementById('loginUser').value.trim().toLowerCase();
      const pass = document.getElementById('loginPass').value.trim();

      if (!user || !pass) return alert('請輸入帳號與密碼！');

      const isValid = await window.cloudDB.verifyCustomUser(user, pass);
      if (isValid) {
        document.getElementById('loginError').classList.add('hidden');
        loginSuccess(user);
      } else {
        document.getElementById('loginError').classList.remove('hidden');
      }
    }

    async function handleGoogleSignIn() {
      try {
        const result = await window.cloudAuth.loginWithGoogle();
        const googleUser = result.user;
        const binding = await window.cloudDB.getGoogleBinding(googleUser.uid);

        if (binding && binding.customUser) {
          loginSuccess(binding.customUser);
        } else {
          alert('此 Google 帳號尚未在欠款系統完成綁定，請先至欠款系統登入一次綁定自訂帳號！');
        }
      } catch (err) {
        alert('Google 登入取消或失敗：' + err.message);
      }
    }

    function loginSuccess(username) {
      state.isLoggedIn = true;
      state.currentUser = username;
      localStorage.setItem('stock_auth', 'true');
      localStorage.setItem('stock_current_user', username);

      // 監聽此用戶在雲端的自選股清單
      window.cloudDB.listenFavorites(username, (cloudFavs) => {
        if (cloudFavs && Array.isArray(cloudFavs)) {
          state.favorites = cloudFavs;
        } else {
          state.favorites = DEFAULT_FAVORITES;
        }
        localStorage.setItem('stock_favorites', JSON.stringify(state.favorites));
        renderFavoritesButtons();
        updateFavoriteButtonState();
      });

      init();
    }

    async function handleGlobalLogout() {
      if (confirm('確定要登出嗎？')) {
        if (window.cloudAuth) await window.cloudAuth.logout();
        localStorage.removeItem('stock_auth');
        localStorage.removeItem('stock_current_user');
        state.isLoggedIn = false;
        state.currentUser = '';
        init();
      }
    }

    // ========== 自選股 (我的最愛) 新增與刪除 ==========
    function renderFavoritesButtons() {
      const container = document.getElementById('favoritesContainer');
      container.innerHTML = state.favorites.map(sym => {
        const isSelected = sym === state.selectedStock;
        const stockName = STOCK_NAME_MAP[sym] || '個股';
        return `
          <div class="inline-flex items-center rounded-xl border text-xs overflow-hidden transition ${
            isSelected 
              ? 'bg-sky-600 text-white border-sky-500 shadow-md font-bold' 
              : 'bg-slate-800 text-slate-300 border-slate-700 hover:bg-slate-700'
          }">
            <button onclick="selectStock('${sym}')" class="px-3 py-1.5">
              ${stockName} (${sym})
            </button>
            <button onclick="removeFavorite('${sym}')" title="移除最愛" class="px-2 py-1.5 text-slate-400 hover:text-rose-400 font-bold border-l border-slate-700/50">
              ✕
            </button>
          </div>
        `;
      }).join('');
    }

    function selectStock(sym) {
      state.selectedStock = sym;
      renderFavoritesButtons();
      updateFavoriteButtonState();
      loadStockData(sym);
    }

    function addNewStock() {
      const input = document.getElementById('newStockInput');
      const sym = input.value.trim().toUpperCase();
      if (!sym) return;

      if (!state.favorites.includes(sym)) {
        state.favorites.push(sym);
        saveFavoritesToCloud();
      }
      input.value = '';
      selectStock(sym);
    }

    function removeFavorite(sym) {
      if (state.favorites.length <= 1) {
        return alert('請至少保留一檔自選股票！');
      }
      state.favorites = state.favorites.filter(s => s !== sym);
      if (state.selectedStock === sym) {
        state.selectedStock = state.favorites[0];
      }
      saveFavoritesToCloud();
      renderFavoritesButtons();
      updateFavoriteButtonState();
      loadStockData(state.selectedStock);
    }

    function toggleCurrentFavorite() {
      const sym = state.selectedStock;
      if (state.favorites.includes(sym)) {
        removeFavorite(sym);
      } else {
        state.favorites.push(sym);
        saveFavoritesToCloud();
        renderFavoritesButtons();
        updateFavoriteButtonState();
      }
    }

    function updateFavoriteButtonState() {
      const btn = document.getElementById('toggleFavBtn');
      const text = document.getElementById('favStatusText');
      const isFav = state.favorites.includes(state.selectedStock);

      if (isFav) {
        btn.innerHTML = '⭐';
        btn.className = 'p-2 rounded-lg border border-amber-500/50 bg-amber-500/10 text-amber-400 text-lg';
        text.innerText = '已收藏於最愛';
        text.className = 'text-xs font-bold text-amber-400 mt-1';
      } else {
        btn.innerHTML = '☆';
        btn.className = 'p-2 rounded-lg border border-slate-700 text-slate-400 text-lg hover:bg-slate-800';
        text.innerText = '未在自選清單';
        text.className = 'text-xs font-bold text-slate-400 mt-1';
      }
    }

    function saveFavoritesToCloud() {
      localStorage.setItem('stock_favorites', JSON.stringify(state.favorites));
      if (window.cloudDB && state.currentUser) {
        window.cloudDB.saveFavorites(state.currentUser, state.favorites);
      }
    }

    // ========== 載入資料與繪製圖表 ==========
    function generateMockDataIfMissing(sym) {
      // 若後端 Actions 尚未抓到冷門股，自動根據代號產生合理的幾何布朗運動範例
      let base = 100.0;
      if (sym === '2330') base = 980.0;
      else if (sym === '2454') base = 1250.0;
      else if (sym === '2317') base = 185.0;
      else if (sym === '2603') base = 195.0;

      const candles = [];
      let cur = base * 0.92;
      const now = new Date();
      for (let i = 60; i >= 0; i--) {
        const d = new Date(now.getTime() - i * 24 * 60 * 60 * 1000);
        if (d.getDay() === 0 || d.getDay() === 6) continue;
        const dateStr = d.toISOString().split('T')[0];
        const open = cur + (Math.random() - 0.48) * (base * 0.02);
        const close = open + (Math.random() - 0.46) * (base * 0.025);
        const high = Math.max(open, close) + Math.random() * (base * 0.01);
        const low = Math.min(open, close) - Math.random() * (base * 0.01);
        cur = close;
        candles.push({
          time: dateStr,
          open: Math.round(open * 10) / 10,
          high: Math.round(high * 10) / 10,
          low: Math.round(low * 10) / 10,
          close: Math.round(close * 10) / 10,
          volume: Math.floor(Math.random() * 30000) + 10000
        });
      }

      const p10 = [], p50 = [], p90 = [];
      for (let i = 1; i <= 20; i++) {
        p10.push(Math.round(cur * (1 - 0.003 * i) * 10) / 10);
        p50.push(Math.round(cur * (1 + 0.002 * i) * 10) / 10);
        p90.push(Math.round(cur * (1 + 0.007 * i) * 10) / 10);
      }

      return {
        symbol: sym,
        institutional_investors: { total_net_lots: 3250 },
        signal: { upward_probability_10d: 71.5, bias_rating: "Bullish" },
        monte_carlo: {
          current_price: Math.round(cur * 10) / 10,
          days_ahead: 20,
          scenarios: { p10_support: p10, p50_median: p50, p90_optimistic: p90 }
        },
        candles: candles
      };
    }

    async function loadStockData(sym) {
      try {
        const res = await fetch(`./data/stocks/${sym}.json`);
        if (res.ok) {
          state.currentStockData = await res.json();
        } else {
          state.currentStockData = generateMockDataIfMissing(sym);
        }
      } catch (e) {
        state.currentStockData = generateMockDataIfMissing(sym);
      }
      renderDataAndChart();
    }

    function renderDataAndChart() {
      const d = state.currentStockData;
      if (!d) return;

      const name = STOCK_NAME_MAP[d.symbol] || '個股';
      document.getElementById('cardPrice').innerText = `${d.monte_carlo.current_price} 元`;
      document.getElementById('cardProb').innerText = `${d.signal.upward_probability_10d}% (${d.signal.bias_rating})`;
      
      const lots = d.institutional_investors.total_net_lots;
      const instElem = document.getElementById('cardInst');
      instElem.innerText = `${lots > 0 ? '+' : ''}${lots} 張`;
      instElem.className = lots >= 0 ? 'text-base font-bold text-rose-500 mt-1' : 'text-base font-bold text-emerald-400 mt-1';

      document.getElementById('chartTitle').innerText = `${name} (${d.symbol}) 走勢與未來 20 日情境預測`;
      document.getElementById('badgeP90').innerText = `● P90: ${d.monte_carlo.scenarios.p90_optimistic.slice(-1)[0]}`;
      document.getElementById('badgeP50').innerText = `-- P50: ${d.monte_carlo.scenarios.p50_median.slice(-1)[0]}`;
      document.getElementById('badgeP10').innerText = `● P10: ${d.monte_carlo.scenarios.p10_support.slice(-1)[0]}`;

      initOrUpdateChart(d);
    }

    function initOrUpdateChart(data) {
      const container = document.getElementById('tvChartContainer');

      if (!chartInstance) {
        chartInstance = LightweightCharts.createChart(container, {
          width: container.clientWidth,
          height: 460,
          layout: {
            background: { color: '#0f172a' },
            textColor: '#94a3b8',
          },
          grid: {
            vertLines: { color: '#1e293b' },
            horzLines: { color: '#1e293b' },
          },
          timeScale: {
            borderColor: '#334155',
            rightOffset: 15,
          },
        });

        // 台股規格：紅漲綠跌
        candleSeries = chartInstance.addCandlestickSeries({
          upColor: '#ef4444',
          downColor: '#10b981',
          borderUpColor: '#ef4444',
          borderDownColor: '#10b981',
          wickUpColor: '#ef4444',
          wickDownColor: '#10b981',
        });

        p90Series = chartInstance.addLineSeries({
          color: 'rgba(16, 185, 129, 0.8)',
          lineWidth: 1,
          title: 'P90 樂觀目標',
        });

        p50Series = chartInstance.addLineSeries({
          color: '#38bdf8',
          lineWidth: 2,
          lineStyle: LightweightCharts.LineStyle.Dashed,
          title: 'P50 中位基準',
        });

        p10Series = chartInstance.addLineSeries({
          color: 'rgba(239, 68, 68, 0.8)',
          lineWidth: 1,
          title: 'P10 悲觀支撐',
        });

        window.addEventListener('resize', () => {
          chartInstance.applyOptions({ width: container.clientWidth });
        });
      }

      // 更新 K 線資料
      candleSeries.setData(data.candles);

      // 計算未來預測日期
      const lastCandle = data.candles[data.candles.length - 1];
      const lastDate = new Date(lastCandle.time);
      const futureDates = [];
      let temp = new Date(lastDate);

      while (futureDates.length < data.monte_carlo.days_ahead) {
        temp.setDate(temp.getDate() + 1);
        if (temp.getDay() !== 0 && temp.getDay() !== 6) {
          futureDates.push(temp.toISOString().split('T')[0]);
        }
      }

      const timeline = [lastCandle.time, ...futureDates];
      const p10Vals = [data.monte_carlo.current_price, ...data.monte_carlo.scenarios.p10_support];
      const p50Vals = [data.monte_carlo.current_price, ...data.monte_carlo.scenarios.p50_median];
      const p90Vals = [data.monte_carlo.current_price, ...data.monte_carlo.scenarios.p90_optimistic];

      p90Series.setData(timeline.map((t, i) => ({ time: t, value: p90Vals[i] })));
      p50Series.setData(timeline.map((t, i) => ({ time: t, value: p50Vals[i] })));
      p10Series.setData(timeline.map((t, i) => ({ time: t, value: p10Vals[i] })));

      chartInstance.timeScale().fitContent();
    }

    // ========== 初始化入口 ==========
    function init() {
      if (state.isLoggedIn && state.currentUser) {
        document.getElementById('loginView').classList.add('hidden');
        document.getElementById('mainApp').classList.remove('hidden');
        document.getElementById('currentAccountBadge').innerText = state.currentUser;
        renderFavoritesButtons();
        updateFavoriteButtonState();
        loadStockData(state.selectedStock);
      } else {
        document.getElementById('loginView').classList.remove('hidden');
        document.getElementById('mainApp').classList.add('hidden');
      }
    }

    window.onload = init;
  </script>
</body>
</html>
